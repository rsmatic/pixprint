name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_BASE: /pixprint/
          # the Express API on EC2 (Caddy terminates HTTPS)
          VITE_API_URL: ${{ vars.API_URL || 'https://pixprint.54-227-48-13.sslip.io' }}
      # GitHub Pages has no SPA rewrites: serve the app for unknown paths like /pixprint/track/<token>
      - run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
